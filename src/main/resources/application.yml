spring:
  application:
    name: smartcollector-admin

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  datasource:
    oracle:
      url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
      username: ${DB_USER:smartcollector}
      password: ${DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 10
        pool-name: oracle-pool
    mysql:
      url: ${MYSQL_URL:jdbc:mysql://localhost:3306/smartcollector_read?useSSL=false&serverTimezone=America/Sao_Paulo}
      username: ${MYSQL_USER:smartcollector}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        pool-name: mysql-pool

  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO:10000}
    lote: 50

joinfaces:
  faces:
    project-stage: ${FACES_STAGE:Production}
    automatic-extensionless-mapping: false
  primefaces:
    theme: saga
    font-awesome: false

server:
  port: ${PORT:8081}
  servlet:
    session:
      timeout: 30m

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG:warn}
