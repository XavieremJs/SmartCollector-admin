spring.application.name=smartcollector-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema Oracle e versionado pelo modulo admin (Flyway). Aqui apenas validamos
# que as entidades batem com as tabelas existentes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25

# Vazio em desenvolvimento gera uma chave aleatoria a cada boot (os tokens nao
# sobrevivem ao restart). Em producao defina JWT_SECRET com 32+ bytes.
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
