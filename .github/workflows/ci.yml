name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execucao por referencia: um push novo cancela o anterior em vez de
# empilhar fila e gastar runner com um commit que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build e testes (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Um modulo quebrado nao esconde o resultado do outro.
      fail-fast: false
      matrix:
        include:
          - modulo: admin
            diretorio: .
          - modulo: api
            diretorio: ./api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura o JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compila e roda os testes
        working-directory: ${{ matrix.diretorio }}
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Guarda os relatorios de teste
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-${{ matrix.modulo }}
          path: ${{ matrix.diretorio }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  imagem:
    name: Imagem Docker (${{ matrix.modulo }})
    # Sem testes verdes nao se constroi imagem nenhuma.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - modulo: admin
            contexto: .
            dockerfile: ./Dockerfile
          - modulo: api
            contexto: ./api
            dockerfile: ./api/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # O ghcr.io so aceita nomes em minusculas e o dono deste repositorio
      # tem maiusculas no login. Normalizar aqui evita o classico 403.
      - name: Normaliza o nome da imagem
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smartcollector-${{ matrix.modulo }}" >> "$GITHUB_OUTPUT"

      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3

      # Em pull request a imagem e apenas construida, para validar o
      # Dockerfile. Publicar so faz sentido no que ja esta no main.
      - name: Autentica no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Monta as tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagem.outputs.nome }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Constroi e publica
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
